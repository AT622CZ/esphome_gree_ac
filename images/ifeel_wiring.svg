<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Arial, Helvetica, sans-serif">
  <title>I FEEL wiring: ESP32 to the output of the unit's IR receiver through an NPN transistor</title>
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <!-- IR receiver of the indoor unit -->
  <rect x="30" y="50" width="170" height="200" rx="6" fill="#f3f1ea" stroke="#444" stroke-width="1.5"/>
  <text x="115" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">IR receiver</text>
  <text x="115" y="92" text-anchor="middle" font-size="12" fill="#555">of the indoor unit</text>
  <text x="46" y="124" font-size="13" fill="#222">VCC</text>
  <text x="46" y="164" font-size="13" fill="#222">OUT</text>
  <text x="46" y="234" font-size="13" fill="#222">GND</text>

  <!-- ESP32 -->
  <rect x="560" y="50" width="130" height="200" rx="6" fill="#e6f0fb" stroke="#1b5fa8" stroke-width="1.5"/>
  <text x="625" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">ESP32</text>
  <text x="625" y="92" text-anchor="middle" font-size="12" fill="#1b5fa8">3.3 V logic</text>
  <text x="574" y="204" font-size="13" fill="#0c447c">GPIO (TX)</text>
  <text x="574" y="234" font-size="13" fill="#0c447c">GND</text>

  <!-- +5 V rail and pull-up on the unit board -->
  <line x1="200" y1="120" x2="300" y2="120" stroke="#222" stroke-width="1.5"/>
  <text x="212" y="112" font-size="12" fill="#555">+5 V (unit board)</text>
  <rect x="292" y="126" width="16" height="26" rx="2" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="120" x2="300" y2="126" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="152" x2="300" y2="160" stroke="#222" stroke-width="1.5"/>
  <text x="314" y="143" font-size="12" fill="#555">pull-up (on board)</text>

  <!-- OUT line: to the collector and on to the unit's MCU -->
  <line x1="200" y1="160" x2="400" y2="160" stroke="#222" stroke-width="1.5"/>
  <circle cx="300" cy="160" r="3" fill="#222"/>
  <circle cx="400" cy="160" r="3" fill="#222"/>
  <line x1="400" y1="160" x2="530" y2="160" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="152" font-size="12" fill="#555">to the unit's MCU</text>

  <!-- NPN transistor, base towards the ESP -->
  <line x1="400" y1="160" x2="400" y2="178" stroke="#222" stroke-width="1.5"/>
  <circle cx="400" cy="200" r="24" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <line x1="412" y1="184" x2="412" y2="216" stroke="#222" stroke-width="3"/>
  <line x1="400" y1="178" x2="412" y2="193" stroke="#222" stroke-width="1.5"/>
  <line x1="412" y1="207" x2="400" y2="222" stroke="#222" stroke-width="1.5"/>
  <polygon points="400,222 409,217 402,212" fill="#222"/>
  <line x1="400" y1="222" x2="400" y2="290" stroke="#222" stroke-width="1.5"/>

  <!-- pin letters, outside the symbol -->
  <text x="388" y="172" text-anchor="end" font-size="12" fill="#555">C</text>
  <text x="388" y="242" text-anchor="end" font-size="12" fill="#555">E</text>
  <text x="432" y="194" font-size="12" fill="#555">B</text>

  <!-- transistor type, left of the symbol -->
  <text x="364" y="198" text-anchor="end" font-size="13" font-weight="bold" fill="#222">KC148</text>
  <text x="364" y="214" text-anchor="end" font-size="12" fill="#555">or BC547, 2N2222 ...</text>

  <!-- base resistor straight to the GPIO -->
  <line x1="412" y1="200" x2="460" y2="200" stroke="#222" stroke-width="1.5"/>
  <rect x="460" y="192" width="40" height="16" rx="2" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="480" y="186" text-anchor="middle" font-size="12" fill="#222">1 k&#937;</text>
  <line x1="500" y1="200" x2="560" y2="200" stroke="#222" stroke-width="1.5"/>

  <!-- ground -->
  <line x1="200" y1="230" x2="240" y2="230" stroke="#222" stroke-width="1.5"/>
  <line x1="240" y1="230" x2="240" y2="290" stroke="#222" stroke-width="1.5"/>
  <line x1="240" y1="290" x2="530" y2="290" stroke="#222" stroke-width="1.5"/>
  <circle cx="400" cy="290" r="3" fill="#222"/>
  <line x1="530" y1="290" x2="530" y2="230" stroke="#222" stroke-width="1.5"/>
  <line x1="530" y1="230" x2="560" y2="230" stroke="#222" stroke-width="1.5"/>
  <text x="385" y="308" text-anchor="middle" font-size="12" fill="#555">common GND (already present in the WiFi module connector)</text>

  <!-- notes -->
  <rect x="30" y="322" width="660" height="66" rx="6" fill="#fdf3d8" stroke="#b98a1a" stroke-width="1"/>
  <text x="44" y="341" font-size="12" fill="#5c4300">GPIO high = transistor on = OUT pulled to GND, like the receiver does on an IR mark.</text>
  <text x="44" y="359" font-size="12" fill="#5c4300">Idle = transistor off, the line is free and the IR remote keeps working. The ESP pin never sees 5 V.</text>
  <text x="44" y="377" font-size="12" fill="#5c4300">remote_transmitter: no "inverted" (the transistor inverts), carrier_duty_percent: 100% (no carrier).</text>
</svg>
