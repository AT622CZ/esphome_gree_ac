<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Arial, Helvetica, sans-serif">
  <title>I FEEL wiring: ESP32 to the output of the unit's IR receiver through an NPN transistor</title>
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <!-- IR receiver of the indoor unit -->
  <rect x="30" y="60" width="170" height="200" rx="6" fill="#f3f1ea" stroke="#444" stroke-width="1.5"/>
  <text x="115" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">IR receiver</text>
  <text x="115" y="102" text-anchor="middle" font-size="12" fill="#555">of the indoor unit</text>
  <text x="46" y="134" font-size="13" fill="#222">VCC</text>
  <text x="46" y="174" font-size="13" fill="#222">OUT</text>
  <text x="46" y="244" font-size="13" fill="#222">GND</text>

  <!-- ESP32 -->
  <rect x="560" y="60" width="130" height="200" rx="6" fill="#e6f0fb" stroke="#1b5fa8" stroke-width="1.5"/>
  <text x="625" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">ESP32</text>
  <text x="625" y="102" text-anchor="middle" font-size="12" fill="#1b5fa8">3.3 V logic</text>
  <text x="574" y="214" font-size="13" fill="#0c447c">GPIO (TX)</text>
  <text x="574" y="244" font-size="13" fill="#0c447c">GND</text>

  <!-- +5 V rail and pull-up on the unit board -->
  <line x1="200" y1="130" x2="330" y2="130" stroke="#222" stroke-width="1.5"/>
  <text x="212" y="122" font-size="12" fill="#555">+5 V (unit board)</text>
  <rect x="322" y="136" width="16" height="26" rx="2" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <line x1="330" y1="130" x2="330" y2="136" stroke="#222" stroke-width="1.5"/>
  <line x1="330" y1="162" x2="330" y2="170" stroke="#222" stroke-width="1.5"/>
  <text x="316" y="154" text-anchor="end" font-size="12" fill="#555">pull-up (on board)</text>

  <!-- OUT line to the main board and to the collector -->
  <line x1="200" y1="170" x2="420" y2="170" stroke="#222" stroke-width="1.5"/>
  <circle cx="330" cy="170" r="3" fill="#222"/>
  <circle cx="420" cy="170" r="3" fill="#222"/>
  <line x1="420" y1="170" x2="520" y2="170" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="432" y="162" font-size="12" fill="#555">to the unit's MCU</text>

  <!-- NPN transistor -->
  <line x1="420" y1="170" x2="420" y2="188" stroke="#222" stroke-width="1.5"/>
  <circle cx="420" cy="210" r="24" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <line x1="408" y1="194" x2="408" y2="226" stroke="#222" stroke-width="3"/>
  <line x1="420" y1="188" x2="408" y2="203" stroke="#222" stroke-width="1.5"/>
  <line x1="408" y1="217" x2="420" y2="232" stroke="#222" stroke-width="1.5"/>
  <polygon points="420,232 411,227 416,221" fill="#222"/>
  <line x1="420" y1="232" x2="420" y2="290" stroke="#222" stroke-width="1.5"/>
  <text x="452" y="206" font-size="13" font-weight="bold" fill="#222">KC148</text>
  <text x="452" y="222" font-size="12" fill="#555">or BC547, 2N2222 ...</text>
  <text x="426" y="186" font-size="11" fill="#555">C</text>
  <text x="426" y="246" font-size="11" fill="#555">E</text>
  <text x="394" y="204" font-size="11" fill="#555">B</text>

  <!-- base resistor and GPIO wire -->
  <line x1="408" y1="210" x2="372" y2="210" stroke="#222" stroke-width="1.5"/>
  <rect x="332" y="202" width="40" height="16" rx="2" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="352" y="196" text-anchor="middle" font-size="12" fill="#222">1 k&#937;</text>
  <line x1="332" y1="210" x2="290" y2="210" stroke="#222" stroke-width="1.5"/>
  <line x1="290" y1="210" x2="290" y2="330" stroke="#222" stroke-width="1.5"/>
  <line x1="290" y1="330" x2="540" y2="330" stroke="#222" stroke-width="1.5"/>
  <line x1="540" y1="330" x2="540" y2="210" stroke="#222" stroke-width="1.5"/>
  <line x1="540" y1="210" x2="560" y2="210" stroke="#222" stroke-width="1.5"/>

  <!-- ground -->
  <line x1="200" y1="240" x2="240" y2="240" stroke="#222" stroke-width="1.5"/>
  <line x1="240" y1="240" x2="240" y2="290" stroke="#222" stroke-width="1.5"/>
  <line x1="240" y1="290" x2="500" y2="290" stroke="#222" stroke-width="1.5"/>
  <circle cx="420" cy="290" r="3" fill="#222"/>
  <line x1="500" y1="290" x2="500" y2="240" stroke="#222" stroke-width="1.5"/>
  <line x1="500" y1="240" x2="560" y2="240" stroke="#222" stroke-width="1.5"/>
  <text x="30" y="284" font-size="12" fill="#555">common GND (WiFi module connector)</text>

  <!-- notes -->
  <rect x="30" y="348" width="660" height="68" rx="6" fill="#fdf3d8" stroke="#b98a1a" stroke-width="1"/>
  <text x="44" y="367" font-size="12" fill="#5c4300">GPIO high = transistor on = OUT pulled to GND, like the receiver does on an IR mark.</text>
  <text x="44" y="385" font-size="12" fill="#5c4300">Idle = transistor off, the line is free and the IR remote keeps working. The ESP pin never sees 5 V.</text>
  <text x="44" y="403" font-size="12" fill="#5c4300">remote_transmitter: no "inverted" (the transistor inverts), carrier_duty_percent: 100% (no carrier).</text>
</svg>
